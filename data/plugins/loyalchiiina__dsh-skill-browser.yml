url: https://github.com/loyalchiiina/dsh-skill-browser
name: loyalchiiina/dsh-skill-browser
category: ui
description:
  en: 'Skills and MCP browser behind one floating ball with four tabs: Skills (native folder picker, two-level categories plus custom groups, tree or flat view, manual, keyword and AI grouping on metadata only, search, and per-card or whole-library enable/disable with timestamped backups), Call Ledger (counts, success rate, trend, ranking), MCP (live loader config, real Fiber states, per-server tools and call stats, enable, disable, reconnect, export to mcpServers JSON, plus scan-and-AI-fix for unconfigured servers) and Quick Start. The floating-ball nav panel splits plugins into two switchable blocks (author plugins / plugin versions) and adds one-click update check across all 15 plugins; the MCP market serves cached results instantly and refreshes in the background; category chips follow skin-aware semantic colors so they stay readable on light skins. 130 skins sync across the three balls. Adapts DSH kernel 0.2.2-rc.1.'
  zh: '技能与 MCP 浏览器：一个悬浮球四个页面。技能浏览（系统目录选库、两级分类加自定义分组、树状/平铺、手动/关键词/AI 分组且只发元数据、搜索、单卡或全库启停并自动备份）、调用台账（次数/成功率/趋势/排行）、MCP（真实 loader 配置与 Fiber 状态、工具与调用统计、启停/重连/导出，并扫描未配置服务器做 AI 修复）、快速上手。悬浮球导航分区把「作者插件」与「插件版本」做成两块切换，15 行版本支持一键检查更新；MCP 市场过期缓存先秒回再后台刷新；分类标签接皮肤语义变量，浅色皮肤下同样清晰。130 款皮肤在三颗悬浮球间同步。适配 DSH 内核 0.2.2-rc.1。'
