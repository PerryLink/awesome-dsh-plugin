url: https://github.com/loyalchiiina/dsh-browser-hub
name: loyalchiiina/dsh-browser-hub
category: browser
description:
  en: "Adds a toolbar to the built-in sidebar Browser tab with a search-engine picker (Baidu / Bing / Google / Sogou / 360 / custom), a searchable bookmarks panel with multi-level folders (add/edit/delete/import Netscape bookmark HTML), a browsing-history panel that shares the same page through capsule tabs (auto-recorded pages, search by title or URL, delete a single entry, two-step clear), and a toolbar version-check button showing four states (idle / checking / update available with a red dot / up to date / failed); the registry lookup runs in the plugin host and is cached for 6 hours. Keyword-then-Enter in the address bar searches with the selected engine. Requires dsh-better-sidebar >=0.20.0 (the client injects its betterSidebar service and will not load without it). Bookmarks and history stay in local JSON files; no external browser required. Adapts DSH kernel 0.2.2-rc.1."
  zh: "给侧边栏「浏览器」Tab 的工具栏增加搜索引擎选择（百度 / Bing / Google / 搜狗 / 360 / 自定义）、可搜索的书签面板（多级文件夹、增删改、导入书签 HTML）、「浏览历史」面板（与书签用胶囊页签同页切换，自动记录打开过的网页，按标题/网址搜索，可删单条、二次确认清空），以及工具栏版本检查按钮（四态：待检查 / 检查中 / 有新版本带红点 / 已最新 / 失败，注册表查询由插件宿主执行并缓存 6 小时）。地址栏输入关键词回车即用所选引擎搜索。需先装 dsh-better-sidebar >=0.20.0（客户端 inject 其 betterSidebar 服务，缺了不会加载）。书签与历史均存本地 JSON，不依赖外部浏览器。适配 DSH 内核 0.2.2-rc.1。"
